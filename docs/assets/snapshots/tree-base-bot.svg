<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="574" viewBox="0 0 1120 574" role="img" aria-label="base-bot folder snapshot">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#442d18" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1120" height="574" rx="28" fill="#f6f2ea"/>
  <rect x="20" y="20" width="1080" height="534" rx="22" fill="#fffdf8" stroke="#e1d7c8" filter="url(#shadow)"/>
  <circle cx="52" cy="48" r="7" fill="#d36b5c"/>
  <circle cx="76" cy="48" r="7" fill="#e0b95a"/>
  <circle cx="100" cy="48" r="7" fill="#65a56f"/>
  <text x="132" y="55" fill="#6f675c" font-size="17" font-family="system-ui, sans-serif" font-weight="800">base-bot folder snapshot</text>
  <text x="42" y="78" fill="#2a251f" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="500">base-bot/</text><text x="42" y="108" fill="#1f6f63" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="700">├─ cmd/                    起動コマンド群</text><text x="42" y="138" fill="#2a251f" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="500">│  ├─ streamcheck/          Railway本番で動く入口</text><text x="42" y="168" fill="#2a251f" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="500">│  ├─ configcheck/          設定確認コマンド</text><text x="42" y="198" fill="#2a251f" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="500">│  └─ configui/             ローカル用ブラウザ設定UI</text><text x="42" y="228" fill="#1f6f63" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="700">├─ internal/               Plugin本体のGoコード</text><text x="42" y="258" fill="#2a251f" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="500">│  ├─ config/               環境変数・機能ON/OFF</text><text x="42" y="288" fill="#1f6f63" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="700">│  ├─ handler/              投稿イベント処理</text><text x="42" y="318" fill="#1f6f63" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="700">│  └─ scheduler/            定時投稿・放置投稿</text><text x="42" y="348" fill="#1f6f63" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="700">├─ personas/               人格JSON</text><text x="42" y="378" fill="#1f6f63" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="700">├─ assets/                 画像素材・参照画像</text><text x="42" y="408" fill="#1f6f63" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="700">├─ scripts/                PowerShell補助</text><text x="42" y="438" fill="#1f6f63" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="700">├─ docs/                   仕様書・公開ページ</text><text x="42" y="468" fill="#2a251f" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="500">├─ Dockerfile              Railway用コンテナ定義</text><text x="42" y="498" fill="#2a251f" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="500">└─ railway.toml            Railwayデプロイ設定</text>
</svg>