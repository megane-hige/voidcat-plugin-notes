<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-label="Feature Flow">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#efe2d1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2a1e12" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="980" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="870" cy="80" r="120" fill="#6f4e37" opacity=".10"/>
  <circle cx="90" cy="450" r="145" fill="#2f5d50" opacity=".10"/>
  <g filter="url(#shadow)">
    <rect x="44" y="42" width="892" height="96" rx="24" fill="#ffffff" stroke="rgba(38,34,29,.16)"/>
    <text x="78" y="89" font-size="32" font-weight="900" fill="#26221d">Feature Flow</text>
    <text x="78" y="119" font-size="18" fill="#6b6257">mixi2 event → handler / scheduler → OpenAI → mixi2 API</text>
  </g>
  <g filter="url(#shadow)">
    <path d="M260,263.0 C320,263.0 240,263.0 300,263.0" fill="none" stroke="#6f4e37" stroke-width="5" stroke-linecap="round" opacity=".55"/><path d="M500,263.0 C560,263.0 480,263.0 540,263.0" fill="none" stroke="#6f4e37" stroke-width="5" stroke-linecap="round" opacity=".55"/><path d="M740,263.0 C800,263.0 720,263.0 780,263.0" fill="none" stroke="#6f4e37" stroke-width="5" stroke-linecap="round" opacity=".55"/>
    
        <rect x="60" y="205" width="200" height="116" rx="22" fill="#e7f0ec" stroke="rgba(38,34,29,.20)" />
        <text x="82" y="243" font-size="26" font-weight="800" fill="#26221d">mixi2</text>
        <text x="82" y="277" font-size="18" fill="#6b6257">events / posts</text>
        <rect x="300" y="205" width="200" height="116" rx="22" fill="#f6ead9" stroke="rgba(38,34,29,.20)" />
        <text x="322" y="243" font-size="26" font-weight="800" fill="#26221d">handler</text>
        <text x="322" y="277" font-size="18" fill="#6b6257">reply / welcome</text>
        <rect x="540" y="205" width="200" height="116" rx="22" fill="#eee8fa" stroke="rgba(38,34,29,.20)" />
        <text x="562" y="243" font-size="26" font-weight="800" fill="#26221d">OpenAI</text>
        <text x="562" y="277" font-size="18" fill="#6b6257">text / image</text>
        <rect x="780" y="205" width="150" height="116" rx="22" fill="#f3e3d4" stroke="rgba(38,34,29,.20)" />
        <text x="802" y="243" font-size="26" font-weight="800" fill="#26221d">API</text>
        <text x="802" y="277" font-size="18" fill="#6b6257">post back</text>
  </g>
