  <text x="132" y="55" fill="#6f675c" font-size="17" font-family="system-ui, sans-serif" font-weight="800">handler and scheduler snapshot</text>
  <text x="42" y="78" fill="#1f6f63" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="700">internal/</text><text x="42" y="108" fill="#1f6f63" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="700">├─ handler/</text><text x="42" y="138" fill="#2a251f" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="500">│  ├─ admin_entry.go        管理者コマンド入口</text><text x="42" y="168" fill="#2a251f" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="500">│  ├─ welcome_entry.go      新規加入者歓迎入口</text><text x="42" y="198" fill="#2a251f" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="500">│  ├─ theme_entry.go        お題投稿入口</text><text x="42" y="228" fill="#2a251f" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="500">│  ├─ reply_entry.go        自動返信入口</text><text x="42" y="258" fill="#2a251f" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="500">│  └─ reply_image.go        画像返信判定</text><text x="42" y="288" fill="#1f6f63" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="700">└─ scheduler/</text><text x="42" y="318" fill="#2a251f" font-size="19" font-family="Consolas, Menlo, monospace" font-weight="500">   └─ scheduler_entry.go    定時画像・放置投稿入口</text>
</svg>